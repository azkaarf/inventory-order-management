; Bab 1.3: konfigurasi runtime dijadikan bagian dari deployment artifact yang
; dapat diaudit, bukan dibiarkan pada default image yang tidak eksplisit.

; ImageUploader::MAX_BYTES membatasi 2MB di level aplikasi, tapi kalau
; upload_max_filesize PHP lebih kecil/sama, PHP akan menolak lebih dulu
; (UPLOAD_ERR_INI_SIZE) sebelum validasi kita sempat jalan - makanya nilai
; di sini sengaja dibuat sedikit lebih longgar daripada limit aplikasi,
; supaya pesan error yang muncul ke user selalu datang dari validasi kita
; sendiri (jelas dan konsisten), bukan dari penolakan PHP yang lebih kriptik.
upload_max_filesize = 5M
post_max_size = 6M

memory_limit = 256M
max_execution_time = 30

date.timezone = Asia/Jakarta

; Remember-me (AuthController::login()) menaikkan cookie session sampai 30
; hari kalau dicentang. Cookie yang panjang percuma kalau file session-nya
; sendiri di server sudah di-garbage-collect duluan (default PHP ~24 menit),
; jadi gc_maxlifetime ikut dinaikkan supaya keduanya konsisten. Ini berlaku
; global (bukan cuma yang centang remember-me) - trade-off yang disengaja:
; session yang ditinggal nganggur tersimpan lebih lama di disk server,
; tapi itu cuma soal housekeeping, bukan celah keamanan baru (session ID
; tetap token acak yang nggak ketebak; nggak dicentang = cookie tetap
; session-only dan hilang begitu browser ditutup).
session.gc_maxlifetime = 2592000
